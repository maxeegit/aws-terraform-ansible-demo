name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run application test
        run: |
          python -c "from app.app import app; client = app.test_client(); response = client.get('/health'); assert response.status_code == 200; assert response.json['status'] == 'healthy'"

      - name: Build Docker image
        run: |
          docker build -t aws-terraform-ansible-demo:ci ./app
