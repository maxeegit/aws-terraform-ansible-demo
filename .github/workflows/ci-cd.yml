name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    name: Build, Test, Scan and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run application test
        run: |
          python -c "from app.app import app; client = app.test_client(); response = client.get('/health'); assert response.status_code == 200; assert response.json['status'] == 'healthy'"

      - name: Build Docker image
        run: |
          docker build -t aws-terraform-ansible-demo:ci ./app

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aws-terraform-ansible-demo:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Inspect GitHub OIDC claims
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository ID: $GITHUB_REPOSITORY_ID"
          echo "Repository owner: $GITHUB_REPOSITORY_OWNER"
          echo "Repository owner ID: $GITHUB_REPOSITORY_OWNER_ID"
          echo "Ref: $GITHUB_REF"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Event: $GITHUB_EVENT_NAME"    

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::352818908895:role/aws-terraform-ansible-demo-github-actions
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag aws-terraform-ansible-demo:ci \
            352818908895.dkr.ecr.us-east-1.amazonaws.com/aws-terraform-ansible-demo:${{ github.sha }}

      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            352818908895.dkr.ecr.us-east-1.amazonaws.com/aws-terraform-ansible-demo:${{ github.sha }}
