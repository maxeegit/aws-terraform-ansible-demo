name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    name: Build, Test, Scan and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run application test
        run: |
          python -c "from app.app import app; client = app.test_client(); response = client.get('/health'); assert response.status_code == 200; assert response.json['status'] == 'healthy'"

      - name: Build Docker image
        run: |
          docker build -t aws-terraform-ansible-demo:ci ./app

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aws-terraform-ansible-demo:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Inspect GitHub OIDC claims
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository ID: $GITHUB_REPOSITORY_ID"
          echo "Repository owner: $GITHUB_REPOSITORY_OWNER"
          echo "Repository owner ID: $GITHUB_REPOSITORY_OWNER_ID"
          echo "Ref: $GITHUB_REF"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Event: $GITHUB_EVENT_NAME"

          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python -c 'import sys,json; print(json.load(sys.stdin)["value"])')

          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)

          echo "OIDC claims:"
          echo "$PAYLOAD" | python -c '
          import sys,json
          claims=json.load(sys.stdin)
          for key in ["iss","aud","sub","repository","repository_id","repository_owner","repository_owner_id","ref","event_name","workflow"]:
              print(f"{key}: {claims.get(key)}")
          '

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::352818908895:role/aws-terraform-ansible-demo-github-actions
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag aws-terraform-ansible-demo:ci \
            352818908895.dkr.ecr.us-east-1.amazonaws.com/aws-terraform-ansible-demo:${{ github.sha }}

      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            352818908895.dkr.ecr.us-east-1.amazonaws.com/aws-terraform-ansible-demo:${{ github.sha }}

      - name: Deploy to EC2 via SSM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-072891e7a2c68d4de \
            --document-name AWS-RunShellScript \
            --parameters commands='[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 352818908895.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 352818908895.dkr.ecr.us-east-1.amazonaws.com/aws-terraform-ansible-demo:${{ github.sha }}",
              "docker rm -f aws-terraform-ansible-demo 2>/dev/null || true",
              "docker run -d --name aws-terraform-ansible-demo --restart unless-stopped -p 80:8000 352818908895.dkr.ecr.us-east-1.amazonaws.com/aws-terraform-ansible-demo:${{ github.sha }}",
              "sleep 5",
              "curl --fail http://localhost/health"
            ]' \
            --region us-east-1 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-072891e7a2c68d4de \
            --region us-east-1

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-072891e7a2c68d4de \
            --region us-east-1
