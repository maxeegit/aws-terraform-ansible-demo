---
- name: Configure web server
  hosts: web
  become: true

  tasks:

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install web server packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - nginx
        state: present

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/flask-app
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy Flask application
      ansible.builtin.copy:
        src: ../../app/app.py
        dest: /opt/flask-app/app.py
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Copy Python requirements
      ansible.builtin.copy:
        src: ../../app/requirements.txt
        dest: /opt/flask-app/requirements.txt
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Create Python virtual environment
      ansible.builtin.command:
        cmd: python3 -m venv /opt/flask-app/venv
        creates: /opt/flask-app/venv/bin/activate

    - name: Install Python dependencies
      ansible.builtin.pip:
        requirements: /opt/flask-app/requirements.txt
        virtualenv: /opt/flask-app/venv


    - name: Create Gunicorn systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/flask-app.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Flask Application with Gunicorn
          After=network.target

          [Service]
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=/opt/flask-app
          Environment="PATH=/opt/flask-app/venv/bin"
          ExecStart=/opt/flask-app/venv/bin/gunicorn --workers 2 --bind 127.0.0.1:8000 app:app
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start Flask application
      ansible.builtin.systemd:
        name: flask-app
        enabled: true
        state: started

    - name: Configure Nginx reverse proxy
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/flask-app
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;

              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: Enable Flask Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/flask-app
        dest: /etc/nginx/sites-enabled/flask-app
        state: link
        force: true

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Test Nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Enable and restart Nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: restarted
